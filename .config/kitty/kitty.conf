# -----------------------------
# FONT SETTINGS
# -----------------------------
font_family      monospace
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# -----------------------------
# WINDOW LAYOUT
# -----------------------------
window_padding_width 8
placement_strategy   center
hide_window_decorations yes 

# -----------------------------
# APPEARANCE & COLORS
# -----------------------------
cursor               #D6748B
cursor_text_color    background
selection_background #D6748B

# -----------------------------
# TRANSPARENCY
# -----------------------------
background_opacity 1

#------------------------------
#TEXT COLOUR
#-----------------------------
foreground #D6748B
